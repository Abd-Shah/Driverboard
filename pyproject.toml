[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "driver-review-leaderboard"
version = "0.1.0"
description = "An auditable, versioned city driver-review leaderboard"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  "redis>=5.2,<6",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1",
]

[project.scripts]
leaderboard-audit = "tools.audit.cli:main"
leaderboard-iterate = "tools.iteration.cli:main"
leaderboard-phase5-demo = "tools.phase5_demo:main"

[tool.hatch.build.targets.wheel]
packages = ["src/driver_leaderboard", "tools"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"src/driver_leaderboard/api/routes/*.py" = ["B008"]
